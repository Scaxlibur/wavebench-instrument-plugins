[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wavebench-siglent-sdg2000x"
version = "0.7.0"
description = "SIGLENT SDG2000X function and arbitrary waveform generator plugin for WaveBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["wavebench>=0.8,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.entry-points."wavebench.instruments"]
"siglent.sdg2000x" = "wavebench_siglent_sdg2000x:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/wavebench_siglent_sdg2000x"]

[tool.hatch.build.targets.sdist]
exclude = ["/doc/vendor-local"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
