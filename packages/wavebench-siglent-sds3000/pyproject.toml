[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wavebench-siglent-sds3000"
version = "0.1.0"
description = "SIGLENT SDS3000 oscilloscope plugin for WaveBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["wavebench>=0.8.24,<0.9", "PyVICP>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.entry-points."wavebench.instruments"]
"siglent.sds3000" = "wavebench_siglent_sds3000:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/wavebench_siglent_sds3000"]

[tool.hatch.build.targets.sdist]
exclude = ["/doc/vendor-local"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
