[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wavebench-rigol-mso8000"
version = "0.5.0"
description = "RIGOL MSO8104 oscilloscope plugin for WaveBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["wavebench>=0.8.22,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.entry-points."wavebench.instruments"]
"rigol.mso8104" = "wavebench_rigol_mso8000:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/wavebench_rigol_mso8000"]

[tool.hatch.build.targets.sdist]
exclude = ["/doc/vendor-local"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
