[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wavebench-rigol-dg4000"
version = "0.1.0"
description = "RIGOL DG4000 function and arbitrary waveform generator plugin for WaveBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["wavebench>=0.8,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.entry-points."wavebench.instruments"]
"rigol.dg4202" = "wavebench_rigol_dg4000:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/wavebench_rigol_dg4000"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
