[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wavebench-rigol-dm3000"
version = "0.4.0"
description = "LAN-only RIGOL DM3000 and DM3058 multimeter plugin for WaveBench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["wavebench>=0.8.10,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.entry-points."wavebench.instruments"]
"rigol.dm3000" = "wavebench_rigol_dm3000:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/wavebench_rigol_dm3000"]

[tool.hatch.build.targets.sdist]
exclude = ["/doc/vendor-local"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
