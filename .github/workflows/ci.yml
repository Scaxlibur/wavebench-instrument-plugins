name: Plugin lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: WaveBench Core branch or commit with uv lifecycle support
        default: Dev
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: wavebench-instrument-plugins
      - uses: actions/checkout@v4
        with:
          repository: Scaxlibur/wavebench
          ref: ${{ inputs.core_ref || 'Dev' }}
          path: wavebench
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.15"
      - name: Install editable development environment
        working-directory: wavebench-instrument-plugins
        run: python scripts/dev_env.py sync
      - name: Verify development environment
        working-directory: wavebench-instrument-plugins
        run: python scripts/dev_env.py check
      - name: Check code
        working-directory: wavebench-instrument-plugins
        run: uv run --no-project --python .venv python -m ruff check .
      - name: Test development tools
        working-directory: wavebench-instrument-plugins
        run: uv run --no-project --python .venv python -m pytest -q tests/test_dev_env.py
      - name: Test wheel compatibility and pip-free plugin lifecycle
        working-directory: wavebench-instrument-plugins
        run: uv run --no-project --python .venv python -m pytest -q packages -k "wheel or lifecycle"
